interface:
  display_name: "故事事实核对"
  short_description: "通过受信任 MCP 服务核对并修正故事事实"
  default_prompt: "请核对故事中的人物与连续性事实。"
policy:
  allow_implicit_invocation: true
dependencies:
  tools:
    - type: mcp
      value: story-fixture/lookup_story_fact
      transport: stdio
    - type: mcp
      value: story-fixture/save_story_fact
      transport: stdio
